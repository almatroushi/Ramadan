<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Trash Toss 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block;touch-action:none;position:fixed;top:0;left:0}

#tries-bar{position:fixed;top:18px;left:18px;display:flex;gap:10px;align-items:center;z-index:10}
.try-dot{width:22px;height:22px;border-radius:50%;background:#4ade80;border:2.5px solid rgba(255,255,255,0.8);box-shadow:0 2px 8px rgba(74,222,128,0.5);transition:all .3s}
.try-dot.used{background:#374151;box-shadow:none;border-color:rgba(255,255,255,0.25)}

#level-label{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:18px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,0.6);z-index:10;background:rgba(0,0,0,0.3);padding:6px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.15)}

#wind-panel{position:fixed;top:18px;right:18px;background:rgba(15,20,40,0.75);border:1px solid rgba(125,211,252,0.3);border-radius:14px;padding:10px 14px;color:#fff;z-index:10;min-width:90px;text-align:center}
#wind-panel .wlabel{font-size:10px;letter-spacing:2px;opacity:0.6;text-transform:uppercase;margin-bottom:6px}
#wind-arrow-wrap{font-size:28px;color:#7dd3fc;text-shadow:0 0 12px rgba(125,211,252,0.8);margin-bottom:4px}
#wind-bars{display:flex;gap:3px;justify-content:center}
.wbar{width:6px;height:14px;border-radius:3px;background:rgba(125,211,252,0.2)}
.wbar.on{background:#7dd3fc;box-shadow:0 0 6px rgba(125,211,252,0.6)}

#power-track{position:fixed;right:18px;bottom:110px;width:18px;height:150px;background:rgba(0,0,0,0.45);border-radius:9px;overflow:hidden;border:1.5px solid rgba(255,255,255,0.15);z-index:10}
#power-fill{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(to top,#ef4444,#f97316,#eab308,#4ade80);border-radius:9px;transition:height .04s linear}
#power-lbl{position:fixed;right:44px;bottom:150px;color:rgba(255,255,255,0.55);font-size:10px;letter-spacing:2px;text-transform:uppercase;z-index:10;writing-mode:vertical-rl;transform:rotate(180deg)}

#aim-hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.65);font-size:14px;text-align:center;z-index:10;pointer-events:none;padding:8px 18px;background:rgba(0,0,0,0.3);border-radius:20px;border:1px solid rgba(255,255,255,0.1);white-space:nowrap}

#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none;transition:background .4s}
#overlay.show{background:rgba(0,0,0,0.65);pointer-events:all}
#ol-icon{font-size:72px;opacity:0;transform:scale(0.3);transition:opacity .4s,transform .5s cubic-bezier(.34,1.56,.64,1);margin-bottom:8px}
#ol-msg{font-size:40px;font-weight:900;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,0.5);opacity:0;transform:translateY(20px);transition:opacity .4s .1s,transform .4s .1s;margin-bottom:24px;text-align:center;padding:0 20px}
#ol-btn{padding:14px 40px;border-radius:30px;background:linear-gradient(135deg,#4ade80,#16a34a);border:none;color:#fff;font-size:17px;font-weight:700;cursor:pointer;opacity:0;transform:translateY(20px);transition:opacity .4s .2s,transform .4s .2s;box-shadow:0 6px 24px rgba(74,222,128,0.4);display:none}
#overlay.show #ol-icon,#overlay.show #ol-msg{opacity:1;transform:none}
#overlay.show #ol-btn{opacity:1;transform:none;display:block}

#score-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;font-weight:900;color:#4ade80;text-shadow:0 0 30px rgba(74,222,128,0.8);opacity:0;pointer-events:none;z-index:15}
#score-flash.pop{animation:pop .8s forwards}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(0.5)}40%{opacity:1;transform:translate(-50%,-60%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

#err{position:fixed;inset:0;background:#1a1a2e;color:#ef4444;font-size:14px;padding:20px;z-index:999;display:none;word-break:break-all}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="tries-bar">
  <div class="try-dot" id="td0"></div>
  <div class="try-dot" id="td1"></div>
  <div class="try-dot" id="td2"></div>
</div>
<div id="level-label">Level 1</div>
<div id="wind-panel">
  <div class="wlabel">Wind</div>
  <div id="wind-arrow-wrap">&#8594;</div>
  <div id="wind-bars">
    <div class="wbar on"></div><div class="wbar on"></div><div class="wbar on"></div>
    <div class="wbar on"></div><div class="wbar on"></div>
  </div>
</div>
<div id="power-track"><div id="power-fill"></div></div>
<div id="power-lbl">Power</div>
<div id="aim-hint">Drag to aim &#8212; release to throw!</div>

<div id="overlay">
  <div id="ol-icon"></div>
  <div id="ol-msg"></div>
  <button id="ol-btn" onclick="restartGame()">Play Again</button>
</div>
<div id="score-flash">IN!</div>
<div id="err"></div>

<script src="./assets/vendor/three.min.js"></script>
<script>
(function() {
'use strict';

function showErr(msg) {
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = 'ERROR: ' + msg;
}

if (typeof THREE === 'undefined') { showErr('THREE not loaded'); return; }

try {

/* ── CONSTANTS ─────────────────────────────────────────────────────── */
var GRAVITY    = -9.81;
var WIND_AX    = 5.5;
var MAX_SPEED  = 13;
var DRAG_SCALE = 130;
var MAX_TRIES  = 3;
var STEP       = 1000 / 60;

var BIN_X = 0.6, BIN_Z = -4.8;
var BIN_R = 0.44, BIN_H = 0.90;
var TRASH_X = 0, TRASH_Y = 1.45, TRASH_Z = 2.8;

/* ── STATE ─────────────────────────────────────────────────────────── */
var S = { IDLE:0, AIM:1, FLY:2, DONE:3 };
var gState = S.IDLE, tries = MAX_TRIES, won = false;
var drag = { on:false, x0:0, y0:0, x:0, y:0 };
var bPos, bVel, prevBY;
var acc = 0, last = performance.now();
var paused = false;

/* ── RENDERER ──────────────────────────────────────────────────────── */
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x9fd8ef, 0.035);

var camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(0, 8.5, 13);
camera.lookAt(0, 0.5, -2);

/* ── LIGHTS ────────────────────────────────────────────────────────── */
scene.add(new THREE.AmbientLight(0xfff5e0, 0.55));
var sun = new THREE.DirectionalLight(0xfff3cc, 1.5);
sun.position.set(6, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;   sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 40;
scene.add(sun);
var fill = new THREE.DirectionalLight(0xb0d4ff, 0.3);
fill.position.set(-6, 3, -6);
scene.add(fill);

/* ── HELPERS ───────────────────────────────────────────────────────── */
function mLamb(color, opts) {
  var o = { color: color };
  if (opts) { for (var k in opts) o[k] = opts[k]; }
  return new THREE.MeshLambertMaterial(o);
}

/* ── FLOOR ─────────────────────────────────────────────────────────── */
var floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), mLamb(0xc8955a));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
for (var z = -11; z < 12; z += 0.9) {
  var plank = new THREE.Mesh(new THREE.PlaneGeometry(24, 0.02), mLamb(0xb07d44));
  plank.rotation.x = -Math.PI / 2;
  plank.position.set(0, 0.001, z);
  scene.add(plank);
}

/* ── WALLS ─────────────────────────────────────────────────────────── */
var bwall = new THREE.Mesh(new THREE.PlaneGeometry(24, 12), mLamb(0xf0e8d8));
bwall.position.set(0, 6, -10);
bwall.receiveShadow = true;
scene.add(bwall);
var lwall = new THREE.Mesh(new THREE.PlaneGeometry(24, 12), mLamb(0xe8ddd0));
lwall.position.set(-12, 6, 0);
lwall.rotation.y = Math.PI / 2;
scene.add(lwall);
var ceil = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), mLamb(0xfaf6f0));
ceil.rotation.x = Math.PI / 2;
ceil.position.y = 10;
scene.add(ceil);
var skirt = new THREE.Mesh(new THREE.BoxGeometry(24, 0.18, 0.08), mLamb(0x9a7356));
skirt.position.set(0, 0.09, -9.9);
scene.add(skirt);

/* ── DESK ──────────────────────────────────────────────────────────── */
var deskMat = mLamb(0x6b4226);
var deskG = new THREE.Group();
deskG.position.set(0, 0, TRASH_Z - 0.3);
var deskTop = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.1, 1.4), mLamb(0x5a3720));
deskTop.position.y = 1.36; deskTop.castShadow = true; deskTop.receiveShadow = true;
deskG.add(deskTop);
[[-1.1,-0.5],[1.1,-0.5],[-1.1,0.5],[1.1,0.5]].forEach(function(p) {
  var leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.28, 0.08), deskMat);
  leg.position.set(p[0], 0.64, p[1]); leg.castShadow = true;
  deskG.add(leg);
});
var drawer = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.22, 0.06), mLamb(0x7a5030));
drawer.position.set(0, 1.14, -0.7);
deskG.add(drawer);
scene.add(deskG);

/* ── BIN ───────────────────────────────────────────────────────────── */
var binG = new THREE.Group();
binG.position.set(BIN_X, 0, BIN_Z);
var binBody = new THREE.Mesh(
  new THREE.CylinderGeometry(BIN_R + 0.04, BIN_R - 0.08, BIN_H, 20),
  mLamb(0x166534)
);
binBody.position.y = BIN_H / 2; binBody.castShadow = true; binBody.receiveShadow = true;
binG.add(binBody);
var rim = new THREE.Mesh(new THREE.TorusGeometry(BIN_R + 0.04, 0.022, 8, 24), mLamb(0x0f4a24));
rim.position.y = BIN_H; rim.rotation.x = Math.PI / 2;
binG.add(rim);
var stripe = new THREE.Mesh(
  new THREE.CylinderGeometry(BIN_R + 0.045, BIN_R - 0.075, 0.06, 20, 1, true),
  mLamb(0xfef9c3, { side: THREE.DoubleSide })
);
stripe.position.y = BIN_H * 0.38;
binG.add(stripe);
scene.add(binG);

/* ── FAN ───────────────────────────────────────────────────────────── */
var fanG = new THREE.Group();
fanG.position.set(-4.5, 0, -1.0);
var fanBase = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 0.07, 16), mLamb(0x334155));
fanBase.position.y = 0.035;
fanBase.castShadow = true;
fanG.add(fanBase);
var fanStand = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.07, 2.0, 10), mLamb(0x475569));
fanStand.position.y = 1.0; fanStand.castShadow = true;
fanG.add(fanStand);
var fanHead = new THREE.Group();
fanHead.position.y = 2.0;
var hub = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), mLamb(0x94a3b8));
fanHead.add(hub);
var bladeG = new THREE.Group();
var bladeMat = mLamb(0xcbd5e1, { transparent: true, opacity: 0.88 });
for (var bi = 0; bi < 4; bi++) {
  var blade = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.44, 0.03), bladeMat);
  var ba = (bi / 4) * Math.PI * 2;
  blade.position.set(Math.sin(ba) * 0.28, Math.cos(ba) * 0.28, 0);
  blade.rotation.z = ba + 0.4;
  bladeG.add(blade);
}
[0.46, 0.52].forEach(function(r) {
  var ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 6, 28), mLamb(0x94a3b8));
  ring.rotation.x = Math.PI / 2;
  bladeG.add(ring);
});
for (var si = 0; si < 6; si++) {
  var sa = (si / 6) * Math.PI * 2;
  var spoke = new THREE.Mesh(new THREE.BoxGeometry(0.012, 1.05, 0.012), mLamb(0x94a3b8));
  spoke.rotation.z = sa;
  bladeG.add(spoke);
}
fanHead.add(bladeG);
fanG.add(fanHead);
scene.add(fanG);

/* ── WIND PARTICLES ────────────────────────────────────────────────── */
var WC = 120;
var wPos = new Float32Array(WC * 3);
var wLife = new Float32Array(WC);
var wGeo = new THREE.BufferGeometry();
function spawnWind(i) {
  wPos[i*3]   = -5.5 + Math.random() * 0.4;
  wPos[i*3+1] = 0.4  + Math.random() * 2.6;
  wPos[i*3+2] = -3.5 + Math.random() * 5.5;
  wLife[i]    = Math.random();
}
for (var wi = 0; wi < WC; wi++) spawnWind(wi);
wGeo.setAttribute('position', new THREE.BufferAttribute(wPos, 3));
var windPts = new THREE.Points(wGeo,
  new THREE.PointsMaterial({ color: 0x7dd3fc, size: 0.13, transparent: true, opacity: 0.80, sizeAttenuation: true })
);
scene.add(windPts);

/* ── BALL ──────────────────────────────────────────────────────────── */
var bGeo = new THREE.IcosahedronGeometry(0.15, 2);
var bAttr = bGeo.attributes.position;
for (var vi = 0; vi < bAttr.count; vi++) {
  bAttr.setX(vi, bAttr.getX(vi) * (1 + (Math.random() - 0.5) * 0.18));
  bAttr.setY(vi, bAttr.getY(vi) * (1 + (Math.random() - 0.5) * 0.18));
  bAttr.setZ(vi, bAttr.getZ(vi) * (1 + (Math.random() - 0.5) * 0.18));
}
bAttr.needsUpdate = true; bGeo.computeVertexNormals();
var ball = new THREE.Mesh(bGeo, mLamb(0xfef9c3));
ball.castShadow = true;
scene.add(ball);

function resetBall() {
  bPos = new THREE.Vector3(TRASH_X, TRASH_Y, TRASH_Z);
  bVel = new THREE.Vector3(0, 0, 0);
  prevBY = TRASH_Y;
  ball.position.copy(bPos);
  ball.visible = true;
}
resetBall();

/* ── TRAJECTORY DOTS ───────────────────────────────────────────────── */
var TP = 50;
var dots = [];
for (var di = 0; di < TP; di++) {
  var dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.025, 5, 5),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: di % 2 === 0 ? 0.55 : 0.0 })
  );
  dot.visible = false;
  scene.add(dot);
  dots.push(dot);
}

function drawTraj(vel) {
  var px = TRASH_X, py = TRASH_Y, pz = TRASH_Z;
  var vx = vel.x, vy = vel.y, vz = vel.z;
  var dt = 0.075;
  for (var ti = 0; ti < TP; ti++) {
    vx += WIND_AX * dt; vy += GRAVITY * dt;
    px += vx * dt; py += vy * dt; pz += vz * dt;
    var show = py > 0 && ti % 2 === 0;
    dots[ti].visible = show;
    if (show) dots[ti].position.set(px, Math.max(py, 0.02), pz);
    if (py < 0) { for (var tj = ti + 1; tj < TP; tj++) dots[tj].visible = false; break; }
  }
}
function hideTraj() { for (var i = 0; i < TP; i++) dots[i].visible = false; }

/* ── CONFETTI ──────────────────────────────────────────────────────── */
var CC = 100;
var cPos  = new Float32Array(CC * 3);
var cCol  = new Float32Array(CC * 3);
var cVels = [];
var PAL = [[1,.85,.2],[.29,.87,.5],[.37,.51,.98],[.94,.27,.41],[.98,.6,.12],[.7,.3,1]];
for (var ci = 0; ci < CC; ci++) {
  cPos[ci*3] = 99; cPos[ci*3+1] = 99; cPos[ci*3+2] = 0;
  var pc = PAL[ci % PAL.length];
  cCol[ci*3] = pc[0]; cCol[ci*3+1] = pc[1]; cCol[ci*3+2] = pc[2];
  cVels.push({ x:0, y:0, z:0, life:0, on:false });
}
var cGeo = new THREE.BufferGeometry();
cGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
cGeo.setAttribute('color',    new THREE.BufferAttribute(cCol, 3));
var confetti = new THREE.Points(cGeo,
  new THREE.PointsMaterial({ size: 0.14, vertexColors: true, transparent: true, opacity: .92, sizeAttenuation: true })
);
scene.add(confetti);

function popConfetti(x, y, z) {
  for (var i = 0; i < CC; i++) {
    cPos[i*3] = x; cPos[i*3+1] = y; cPos[i*3+2] = z;
    cVels[i] = { x:(Math.random()-.5)*7, y:3+Math.random()*5, z:(Math.random()-.5)*7, life:1.5, on:true };
  }
  cGeo.attributes.position.needsUpdate = true;
}

/* ── INPUT ─────────────────────────────────────────────────────────── */
function calcLaunch() {
  var dx = drag.x - drag.x0;
  var dy = drag.y - drag.y0;
  var len = Math.sqrt(dx*dx + dy*dy);
  var power = Math.min(len / DRAG_SCALE, 1);
  var speed = power * MAX_SPEED;
  var wdx = dx, wdz = dy * 0.75;
  var wlen = Math.sqrt(wdx*wdx + wdz*wdz) || 1;
  var ndx = wdx / wlen, ndz = wdz / wlen;
  var elev = (Math.PI / 180) * (28 + power * 37);
  var h = speed * Math.cos(elev);
  return {
    vel: new THREE.Vector3(ndx * h, speed * Math.sin(elev), ndz * h),
    power: power
  };
}

function pDown(cx, cy) {
  if (gState !== S.IDLE) return;
  drag = { on: true, x0: cx, y0: cy, x: cx, y: cy };
  gState = S.AIM;
}
function pMove(cx, cy) {
  if (!drag.on) return;
  drag.x = cx; drag.y = cy;
  var r = calcLaunch();
  document.getElementById('power-fill').style.height = (r.power * 100) + '%';
  drawTraj(r.vel);
}
function pUp() {
  if (!drag.on || gState !== S.AIM) { drag.on = false; return; }
  drag.on = false;
  var r = calcLaunch();
  hideTraj();
  document.getElementById('power-fill').style.height = '0%';
  if (r.power < 0.04) { gState = S.IDLE; return; }
  doThrow(r.vel);
}

canvas.addEventListener('mousedown', function(e) { pDown(e.clientX, e.clientY); });
canvas.addEventListener('mousemove', function(e) { pMove(e.clientX, e.clientY); });
canvas.addEventListener('mouseup',   function()  { pUp(); });
canvas.addEventListener('mouseleave',function()  { if (drag.on) pUp(); });
canvas.addEventListener('touchstart', function(e) { e.preventDefault(); pDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchmove',  function(e) { e.preventDefault(); pMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchend',   function(e) { e.preventDefault(); pUp(); }, { passive: false });
window.addEventListener('keydown', function(e) { if (e.code === 'Space' && gState === S.AIM) { e.preventDefault(); pUp(); } });

/* ── THROW ─────────────────────────────────────────────────────────── */
function doThrow(vel) {
  if (tries <= 0) return;
  gState = S.FLY;
  tries--;
  updateDots();
  bVel.copy(vel);
  document.getElementById('aim-hint').style.opacity = '0';
}

function updateDots() {
  for (var i = 0; i < MAX_TRIES; i++)
    document.getElementById('td' + i).classList.toggle('used', i >= tries);
}

/* ── PHYSICS ───────────────────────────────────────────────────────── */
function physicsTick(dt) {
  var t = dt / 1000;
  prevBY = bPos.y;
  bVel.x += WIND_AX * t;
  bVel.y += GRAVITY * t;
  bPos.x += bVel.x * t;
  bPos.y += bVel.y * t;
  bPos.z += bVel.z * t;
  ball.position.copy(bPos);
  ball.rotation.x += 0.12; ball.rotation.z += 0.08;

  var dx = bPos.x - BIN_X, dz = bPos.z - BIN_Z;
  if (prevBY >= BIN_H && bPos.y < BIN_H && Math.sqrt(dx*dx + dz*dz) < BIN_R) {
    onScore(); return;
  }
  if (bPos.y <= 0 || Math.abs(bPos.x) > 14 || Math.abs(bPos.z) > 14) {
    onMiss();
  }
}

function onScore() {
  won = true; gState = S.DONE;
  ball.visible = false;
  popConfetti(BIN_X, BIN_H + 0.2, BIN_Z);
  var fl = document.getElementById('score-flash');
  fl.classList.remove('pop'); void fl.offsetWidth; fl.classList.add('pop');
  setTimeout(function() { showOverlay('🎉', 'Perfect Shot!', true); }, 600);
}

function onMiss() {
  gState = S.DONE;
  if (tries > 0) {
    setTimeout(function() {
      resetBall();
      document.getElementById('aim-hint').style.opacity = '1';
      gState = S.IDLE;
    }, 900);
  } else {
    setTimeout(function() { showOverlay('😔', 'Out of tries!', false); }, 700);
  }
}

/* ── OVERLAY ───────────────────────────────────────────────────────── */
function showOverlay(icon, msg, isWin) {
  document.getElementById('ol-icon').textContent = icon;
  document.getElementById('ol-msg').textContent  = msg;
  document.getElementById('ol-btn').style.background = isWin
    ? 'linear-gradient(135deg,#4ade80,#16a34a)'
    : 'linear-gradient(135deg,#f97316,#ea580c)';
  document.getElementById('overlay').classList.add('show');
}

window.restartGame = function() {
  tries = MAX_TRIES; won = false; gState = S.IDLE;
  resetBall(); updateDots();
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('aim-hint').style.opacity = '1';
  document.getElementById('power-fill').style.height = '0%';
  for (var i = 0; i < CC; i++) { cPos[i*3] = 99; cVels[i].on = false; }
  cGeo.attributes.position.needsUpdate = true;
};

/* ── RESIZE ────────────────────────────────────────────────────────── */
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function() { setTimeout(resize, 200); });

/* ── LOOP ──────────────────────────────────────────────────────────── */
window.addEventListener('blur',  function() { paused = true; });
window.addEventListener('focus', function() { paused = false; last = performance.now(); });

function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { last = now; return; }
  acc += now - last; last = now;
  while (acc >= STEP) { acc -= STEP; if (gState === S.FLY) physicsTick(STEP); }

  bladeG.rotation.z += 0.18;

  var wp = wGeo.attributes.position;
  for (var wi2 = 0; wi2 < WC; wi2++) {
    wLife[wi2] += 0.008;
    if (wLife[wi2] > 1) { spawnWind(wi2); wLife[wi2] = 0; }
    wPos[wi2*3] += WIND_AX * 0.025 * (0.7 + Math.random() * 0.6);
    if (wPos[wi2*3] > 7) spawnWind(wi2);
  }
  wp.array.set(wPos); wp.needsUpdate = true;

  var cp = cGeo.attributes.position;
  for (var ci2 = 0; ci2 < CC; ci2++) {
    if (!cVels[ci2].on) continue;
    cVels[ci2].life -= 0.016;
    cVels[ci2].y    += GRAVITY * 0.016 * 0.5;
    cPos[ci2*3]   += cVels[ci2].x * 0.016;
    cPos[ci2*3+1] += cVels[ci2].y * 0.016;
    cPos[ci2*3+2] += cVels[ci2].z * 0.016;
    if (cVels[ci2].life <= 0 || cPos[ci2*3+1] < 0) { cPos[ci2*3] = 99; cVels[ci2].on = false; }
  }
  cp.array.set(cPos); cp.needsUpdate = true;

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

} catch(err) { showErr(err.message + '\n' + err.stack); }

})();
</script>
