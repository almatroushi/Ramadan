<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Trash Toss 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block;touch-action:none}

/* HUD */
#tries-bar{position:fixed;top:18px;left:18px;display:flex;gap:10px;align-items:center;z-index:10}
.try-dot{width:22px;height:22px;border-radius:50%;background:#4ade80;border:2.5px solid rgba(255,255,255,0.8);box-shadow:0 2px 8px rgba(74,222,128,0.5);transition:all .3s}
.try-dot.used{background:#374151;box-shadow:none;border-color:rgba(255,255,255,0.25)}

#level-label{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:18px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,0.6);z-index:10;background:rgba(0,0,0,0.3);padding:6px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.15)}

#wind-panel{position:fixed;top:18px;right:18px;background:rgba(15,20,40,0.75);backdrop-filter:blur(10px);border:1px solid rgba(125,211,252,0.3);border-radius:14px;padding:10px 14px;color:#fff;z-index:10;min-width:90px;text-align:center}
#wind-panel .wlabel{font-size:10px;letter-spacing:2px;opacity:0.6;text-transform:uppercase;margin-bottom:6px}
#wind-arrow-wrap{font-size:28px;color:#7dd3fc;text-shadow:0 0 12px rgba(125,211,252,0.8);margin-bottom:4px}
#wind-bars{display:flex;gap:3px;justify-content:center}
.wbar{width:6px;height:14px;border-radius:3px;background:rgba(125,211,252,0.2)}
.wbar.on{background:#7dd3fc;box-shadow:0 0 6px rgba(125,211,252,0.6)}

#power-track{position:fixed;right:18px;bottom:110px;width:18px;height:150px;background:rgba(0,0,0,0.45);border-radius:9px;overflow:hidden;border:1.5px solid rgba(255,255,255,0.15);z-index:10}
#power-fill{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(to top,#ef4444,#f97316,#eab308,#4ade80);border-radius:9px;transition:height .04s linear}
#power-lbl{position:fixed;right:44px;bottom:150px;color:rgba(255,255,255,0.55);font-size:10px;letter-spacing:2px;text-transform:uppercase;z-index:10;writing-mode:vertical-rl;transform:rotate(180deg)}

#aim-hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.65);font-size:14px;text-align:center;z-index:10;pointer-events:none;padding:8px 18px;background:rgba(0,0,0,0.3);border-radius:20px;border:1px solid rgba(255,255,255,0.1);white-space:nowrap}

/* Overlay */
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none;transition:background .4s}
#overlay.show{background:rgba(0,0,0,0.65);pointer-events:all}
#ol-icon{font-size:80px;opacity:0;transform:scale(0.3);transition:opacity .4s,transform .5s cubic-bezier(.34,1.56,.64,1);margin-bottom:8px}
#ol-msg{font-size:44px;font-weight:900;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,0.5);opacity:0;transform:translateY(20px);transition:opacity .4s .1s,transform .4s .1s;margin-bottom:24px}
#ol-btn{padding:14px 40px;border-radius:30px;background:linear-gradient(135deg,#4ade80,#16a34a);border:none;color:#fff;font-size:17px;font-weight:700;cursor:pointer;opacity:0;transform:translateY(20px);transition:opacity .4s .2s,transform .4s .2s;box-shadow:0 6px 24px rgba(74,222,128,0.4);display:none}
#ol-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 30px rgba(74,222,128,0.5)}
#overlay.show #ol-icon,#overlay.show #ol-msg{opacity:1;transform:none}
#overlay.show #ol-btn{opacity:1;transform:none;display:block}

/* Score flash */
#score-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;font-weight:900;color:#4ade80;text-shadow:0 0 30px rgba(74,222,128,0.8);opacity:0;pointer-events:none;z-index:15;transition:none}
#score-flash.pop{animation:pop .8s forwards}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(0.5)}40%{opacity:1;transform:translate(-50%,-60%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

#dev{position:fixed;top:4px;left:4px;color:#0f0;font:11px monospace;display:none;z-index:99}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="tries-bar">
  <div class="try-dot" id="td0"></div>
  <div class="try-dot" id="td1"></div>
  <div class="try-dot" id="td2"></div>
</div>
<div id="level-label">Level 1</div>
<div id="wind-panel">
  <div class="wlabel">Wind</div>
  <div id="wind-arrow-wrap">→</div>
  <div id="wind-bars">
    <div class="wbar on"></div><div class="wbar on"></div><div class="wbar on"></div>
    <div class="wbar"></div><div class="wbar"></div>
  </div>
</div>
<div id="power-track"><div id="power-fill"></div></div>
<div id="power-lbl">Power</div>
<div id="aim-hint">Drag to aim — release to throw!</div>

<!-- Overlay -->
<div id="overlay">
  <div id="ol-icon"></div>
  <div id="ol-msg"></div>
  <button id="ol-btn" onclick="restartGame()">Play Again</button>
</div>
<div id="score-flash">IN!</div>
<div id="dev"></div>

<script src="./assets/vendor/three.min.js"></script>
<script type="module">
import { STR } from './strings.js';

/* ── CONSTANTS ─────────────────────────────────────────────────────────── */
const GRAVITY    = -9.81;
const WIND_AX    = 1.8;          // wind acceleration +X  (fan blows right)
const MAX_SPEED  = 13;           // max launch speed  m/s
const DRAG_SCALE = 130;          // pixels = full power
const MAX_TRIES  = 3;
const STEP       = 1000 / 60;   // fixed physics step ms
const DPR_CAP    = 1.5;

// World positions
const P_TRASH = new THREE.Vector3(0, 1.45, 2.8);   // ball start
const P_BIN   = new THREE.Vector3(0.6, 0, -4.8);   // bin centre (slightly right)
const BIN_R   = 0.44;
const BIN_H   = 0.90;

/* ── GAME STATE ───────────────────────────────────────────────────────── */
const S = { IDLE:0, AIM:1, FLY:2, DONE:3 };
let gState = S.IDLE, tries = MAX_TRIES, won = false;
let drag = { on:false, x0:0, y0:0, x:0, y:0 };
let bPos = P_TRASH.clone(), bVel = new THREE.Vector3();
let prevBY = P_TRASH.y;
let acc = 0, last = performance.now();

/* ── THREE SETUP ──────────────────────────────────────────────────────── */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x9fd8ef, 0.035);

const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 60);
camera.position.set(0, 8.5, 13);
camera.lookAt(0, 0.5, -2);

/* ── LIGHTING ─────────────────────────────────────────────────────────── */
scene.add(new THREE.AmbientLight(0xfff5e0, 0.55));

const sun = new THREE.DirectionalLight(0xfff3cc, 1.5);
sun.position.set(6, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-12, right:12, top:12, bottom:-12, near:0.5, far:40 });
scene.add(sun);
scene.add(Object.assign(new THREE.DirectionalLight(0xb0d4ff, 0.3), {
  position: new THREE.Vector3(-6, 3, -6)
}));

/* ── MATERIALS ────────────────────────────────────────────────────────── */
const mLambert = (c, o={}) => new THREE.MeshLambertMaterial({ color:c, ...o });

/* ── FLOOR ────────────────────────────────────────────────────────────── */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), mLambert(0xc8955a));
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// Wood plank lines via secondary plane strips
for (let z = -11; z < 12; z += 0.9) {
  const plank = new THREE.Mesh(
    new THREE.PlaneGeometry(24, 0.02),
    mLambert(0xb07d44)
  );
  plank.rotation.x = -Math.PI/2;
  plank.position.set(0, 0.001, z);
  scene.add(plank);
}

/* ── WALLS ────────────────────────────────────────────────────────────── */
// Back wall
const bwall = new THREE.Mesh(new THREE.PlaneGeometry(24, 12), mLambert(0xf0e8d8));
bwall.position.set(0, 6, -10);
bwall.receiveShadow = true;
scene.add(bwall);

// Left wall
const lwall = new THREE.Mesh(new THREE.PlaneGeometry(24, 12), mLambert(0xe8ddd0));
lwall.position.set(-12, 6, 0);
lwall.rotation.y = Math.PI/2;
lwall.receiveShadow = true;
scene.add(lwall);

// Ceiling (partial, just visible top)
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), mLambert(0xfaf6f0));
ceil.rotation.x = Math.PI/2;
ceil.position.y = 10;
scene.add(ceil);

// Skirting board
const skirt = new THREE.Mesh(new THREE.BoxGeometry(24, 0.18, 0.08), mLambert(0x9a7356));
skirt.position.set(0, 0.09, -9.9);
scene.add(skirt);

/* ── DESK (player side) ──────────────────────────────────────────────── */
const deskMat = mLambert(0x6b4226);
const deskG = new THREE.Group();
deskG.position.set(0, 0, P_TRASH.z - 0.3);

const deskTop = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.1, 1.4), mLambert(0x5a3720));
deskTop.position.y = 1.36; deskTop.castShadow = true; deskTop.receiveShadow = true;
deskG.add(deskTop);

[[-1.1,-0.5],[1.1,-0.5],[-1.1,0.5],[1.1,0.5]].forEach(([x,z])=>{
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08,1.28,0.08), deskMat);
  leg.position.set(x, 0.64, z); leg.castShadow=true;
  deskG.add(leg);
});

// Desk drawer front
const drawer = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.22,0.06), mLambert(0x7a5030));
drawer.position.set(0, 1.14, -0.7);
deskG.add(drawer);
const dhandle = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.2,8), mLambert(0xc9a84c));
dhandle.rotation.z = Math.PI/2; dhandle.position.set(0, 1.14, -0.73);
deskG.add(dhandle);

scene.add(deskG);

/* ── TRASH BIN ───────────────────────────────────────────────────────── */
const binG = new THREE.Group();
binG.position.set(P_BIN.x, 0, P_BIN.z);

const binBody = new THREE.Mesh(
  new THREE.CylinderGeometry(BIN_R+0.04, BIN_R-0.08, BIN_H, 20),
  mLambert(0x166534)
);
binBody.position.y = BIN_H/2; binBody.castShadow=true; binBody.receiveShadow=true;
binG.add(binBody);

const rim = new THREE.Mesh(new THREE.TorusGeometry(BIN_R+0.04, 0.022, 8, 24), mLambert(0x0f4a24));
rim.position.y = BIN_H; rim.rotation.x = Math.PI/2;
binG.add(rim);

// Stripe on bin
const stripe = new THREE.Mesh(
  new THREE.CylinderGeometry(BIN_R+0.045, BIN_R-0.075, 0.06, 20, 1, true),
  mLambert(0xfef9c3, { side: THREE.DoubleSide })
);
stripe.position.y = BIN_H*0.38;
binG.add(stripe);

// Recycling triangle hint
const hint = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.005,3), mLambert(0xbbf7d0));
hint.position.set(0, BIN_H*0.65, BIN_R+0.052);
hint.rotation.x = -Math.PI/2;
binG.add(hint);

scene.add(binG);

/* ── DECORATIVE ITEMS ON DESK ────────────────────────────────────────── */
// Coffee cup
const cupG = new THREE.Group();
const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.07,0.2,12), mLambert(0xef4444));
cup.position.y=0.1; cupG.add(cup);
const cupTop = new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.01,12), mLambert(0xfca5a5));
cupTop.position.y=0.21; cupG.add(cupTop);
cupG.position.set(0.7,1.41,P_TRASH.z-0.5);
scene.add(cupG);

// Pencil holder
const pen = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.22,10), mLambert(0x6366f1));
pen.position.set(-0.7,1.52,P_TRASH.z-0.5);
pen.castShadow=true;
scene.add(pen);

/* ── FAN (obstacle) ──────────────────────────────────────────────────── */
const fanG = new THREE.Group();
fanG.position.set(-4.5, 0, -1.0);

const fanBase = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,0.07,16), mLambert(0x334155));
fanBase.position.y=0.035; fanBase.castShadow=true;
fanG.add(fanBase);

const fanStand = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.07,2.0,10), mLambert(0x475569));
fanStand.position.y=1.0; fanStand.castShadow=true;
fanG.add(fanStand);

// Adjustable neck joint
const neck = new THREE.Mesh(new THREE.SphereGeometry(0.1,10,10), mLambert(0x334155));
neck.position.y=1.98; fanG.add(neck);

// Fan head (cage + blades group)
const fanHead = new THREE.Group();
fanHead.position.y = 2.0;

// Hub
const hub = new THREE.Mesh(new THREE.SphereGeometry(0.11,12,12), mLambert(0x94a3b8));
fanHead.add(hub);

// Blades
const bladeG = new THREE.Group();
const bladeMat = mLambert(0xcbd5e1, { transparent:true, opacity:0.88 });
for (let i=0; i<4; i++) {
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.44,0.03), bladeMat);
  const a = (i/4)*Math.PI*2;
  blade.position.set(Math.sin(a)*0.28, Math.cos(a)*0.28, 0);
  blade.rotation.z = a + 0.4;
  blade.castShadow=true;
  bladeG.add(blade);
}
// Cage rings (2 concentric)
[0.46, 0.52].forEach(r=>{
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r,0.012,6,28), mLambert(0x94a3b8));
  ring.rotation.x = Math.PI/2;
  bladeG.add(ring);
});
// Cage spokes
for (let i=0; i<6; i++) {
  const a = (i/6)*Math.PI*2;
  const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.012,1.05,0.012), mLambert(0x94a3b8));
  spoke.rotation.z = a;
  bladeG.add(spoke);
}
fanHead.add(bladeG);
fanG.add(fanHead);
scene.add(fanG);

/* ── WIND PARTICLES ──────────────────────────────────────────────────── */
const WC = 80;
const wPos  = new Float32Array(WC*3);
const wLife = new Float32Array(WC);
const wGeo  = new THREE.BufferGeometry();
for (let i=0; i<WC; i++) spawnWindPt(i);
wGeo.setAttribute('position', new THREE.BufferAttribute(wPos,3));
const wMat = new THREE.PointsMaterial({color:0x7dd3fc,size:0.07,transparent:true,opacity:0.55,sizeAttenuation:true});
const windPts = new THREE.Points(wGeo, wMat);
scene.add(windPts);

function spawnWindPt(i) {
  wPos[i*3]   = -5.5 + Math.random()*0.4;
  wPos[i*3+1] = 0.4  + Math.random()*2.6;
  wPos[i*3+2] = -3.5 + Math.random()*5.5;
  wLife[i]    = Math.random();
}

/* ── TRASH BALL ──────────────────────────────────────────────────────── */
const bGeo = new THREE.IcosahedronGeometry(0.15, 2);
const bPosAttr = bGeo.attributes.position;
for (let i=0; i<bPosAttr.count; i++) {
  bPosAttr.setX(i, bPosAttr.getX(i)*(1 + (Math.random()-0.5)*0.18));
  bPosAttr.setY(i, bPosAttr.getY(i)*(1 + (Math.random()-0.5)*0.18));
  bPosAttr.setZ(i, bPosAttr.getZ(i)*(1 + (Math.random()-0.5)*0.18));
}
bPosAttr.needsUpdate=true; bGeo.computeVertexNormals();
const ball = new THREE.Mesh(bGeo, mLambert(0xfef9c3));
ball.castShadow=true;
scene.add(ball);

function resetBall() {
  bPos.copy(P_TRASH); bVel.set(0,0,0); prevBY = P_TRASH.y;
  ball.position.copy(bPos); ball.visible=true;
}
resetBall();

/* ── TRAJECTORY PREVIEW ──────────────────────────────────────────────── */
const TP = 50;
const tGeo = new THREE.BufferGeometry();
const tArr = new Float32Array(TP*3);
tGeo.setAttribute('position', new THREE.BufferAttribute(tArr,3));
const tLine = new THREE.Line(tGeo, new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.38}));
scene.add(tLine); tLine.visible=false;

// Dot meshes for trajectory
const dots = [];
for (let i=0; i<TP; i++) {
  const d = new THREE.Mesh(
    new THREE.SphereGeometry(0.025,6,6),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity: i%2===0?0.6:0.0})
  );
  scene.add(d); d.visible=false; dots.push(d);
}

function drawTrajectory(launchVel) {
  let px=P_TRASH.x, py=P_TRASH.y, pz=P_TRASH.z;
  let vx=launchVel.x, vy=launchVel.y, vz=launchVel.z;
  const dt=0.075;
  for (let i=0; i<TP; i++) {
    vx += WIND_AX*dt; vy += GRAVITY*dt;
    px += vx*dt; py += vy*dt; pz += vz*dt;
    tArr[i*3]=px; tArr[i*3+1]=Math.max(py,0.02); tArr[i*3+2]=pz;
    const vis = py>0 && i%2===0;
    dots[i].visible=vis;
    if (vis) dots[i].position.set(px,Math.max(py,0.02),pz);
    if (py<0) { for(let j=i+1;j<TP;j++){tArr[j*3]=px;tArr[j*3+1]=0.02;tArr[j*3+2]=pz;dots[j].visible=false;} break; }
  }
  tGeo.attributes.position.needsUpdate=true;
}

function hideTraj() { tLine.visible=false; dots.forEach(d=>d.visible=false); }

/* ── CONFETTI ─────────────────────────────────────────────────────────── */
const CC = 100;
const cGeo  = new THREE.BufferGeometry();
const cPos  = new Float32Array(CC*3);
const cCol  = new Float32Array(CC*3);
const cVels = [];
const PALETTE = [[1,.85,.2],[.29,.87,.5],[.37,.51,.98],[.94,.27,.41],[.98,.6,.12],[.7,.3,1]];
for (let i=0;i<CC;i++){
  cPos[i*3]=99; cPos[i*3+1]=99; cPos[i*3+2]=0;
  const c=PALETTE[i%PALETTE.length];
  cCol[i*3]=c[0]; cCol[i*3+1]=c[1]; cCol[i*3+2]=c[2];
  cVels.push({x:0,y:0,z:0,life:0,on:false});
}
cGeo.setAttribute('position',new THREE.BufferAttribute(cPos,3));
cGeo.setAttribute('color',   new THREE.BufferAttribute(cCol,3));
const confetti = new THREE.Points(cGeo, new THREE.PointsMaterial({size:0.14,vertexColors:true,transparent:true,opacity:.92,sizeAttenuation:true}));
scene.add(confetti);

function popConfetti(p) {
  for (let i=0;i<CC;i++){
    cPos[i*3]=p.x; cPos[i*3+1]=p.y; cPos[i*3+2]=p.z;
    cVels[i]={x:(Math.random()-.5)*7, y:3+Math.random()*5, z:(Math.random()-.5)*7, life:1.5, on:true};
  }
  cGeo.attributes.position.needsUpdate=true;
}

/* ── INPUT ────────────────────────────────────────────────────────────── */
function pDown(cx,cy){ if(gState!==S.IDLE) return; drag={on:true,x0:cx,y0:cy,x:cx,y:cy}; gState=S.AIM; }
function pMove(cx,cy){
  if(!drag.on) return;
  drag.x=cx; drag.y=cy;
  const {vel,power}=calcLaunch();
  document.getElementById('power-fill').style.height=(power*100)+'%';
  drawTrajectory(vel);
}
function pUp(){
  if(!drag.on||gState!==S.AIM){ drag.on=false; return; }
  drag.on=false;
  const {vel,power}=calcLaunch();
  hideTraj();
  document.getElementById('power-fill').style.height='0%';
  if(power<0.04){ gState=S.IDLE; return; }
  doThrow(vel);
}

canvas.addEventListener('mousedown', e=>pDown(e.clientX,e.clientY));
canvas.addEventListener('mousemove', e=>pMove(e.clientX,e.clientY));
canvas.addEventListener('mouseup',   ()=>pUp());
canvas.addEventListener('mouseleave',()=>{ if(drag.on) pUp(); });
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); pDown(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
canvas.addEventListener('touchmove',  e=>{ e.preventDefault(); pMove(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
canvas.addEventListener('touchend',   e=>{ e.preventDefault(); pUp(); },{passive:false});
addEventListener('keydown', e=>{ if(e.code==='Space'&&gState===S.AIM){ e.preventDefault(); pUp(); }});

/* ── CALC LAUNCH FROM DRAG ───────────────────────────────────────────── */
function calcLaunch() {
  const dx = drag.x - drag.x0;  // screen right = world +X
  const dy = drag.y - drag.y0;  // screen down  = world +Z (away from us) → negate for fwd
  const len = Math.sqrt(dx*dx+dy*dy);
  const power = Math.min(len/DRAG_SCALE, 1);
  const speed = power * MAX_SPEED;
  // World direction (XZ plane) from screen drag
  // drag UP (dy<0) → world -Z (forward toward bin)
  // drag right (dx>0) → world +X
  const wdx = dx;
  const wdz = dy * 0.75; // slight squash for depth
  const wlen = Math.sqrt(wdx*wdx+wdz*wdz) || 1;
  const ndx = wdx/wlen, ndz = wdz/wlen;
  // elevation: 28° min to 65° max
  const elev = (Math.PI/180) * (28 + power*37);
  const hSpeed = speed * Math.cos(elev);
  const vel = new THREE.Vector3(ndx*hSpeed, speed*Math.sin(elev), ndz*hSpeed);
  return {vel, power};
}

/* ── THROW ────────────────────────────────────────────────────────────── */
function doThrow(vel) {
  if(tries<=0) return;
  gState=S.FLY;
  tries--;
  updateDots();
  bVel.copy(vel);
  document.getElementById('aim-hint').style.opacity='0';
}

function updateDots(){
  for(let i=0;i<MAX_TRIES;i++)
    document.getElementById('td'+i).classList.toggle('used', i>=tries);
}

/* ── PHYSICS UPDATE ──────────────────────────────────────────────────── */
function physicsTick(dt) {
  const t = dt/1000;
  prevBY = bPos.y;

  bVel.x += WIND_AX*t;
  bVel.y += GRAVITY*t;
  bPos.x += bVel.x*t;
  bPos.y += bVel.y*t;
  bPos.z += bVel.z*t;

  ball.position.copy(bPos);
  ball.rotation.x += 0.12; ball.rotation.z += 0.08;

  // Bin collision: did ball cross y=BIN_H from above while in XZ radius?
  const dx=bPos.x-P_BIN.x, dz=bPos.z-P_BIN.z;
  const d2d=Math.sqrt(dx*dx+dz*dz);
  if(prevBY>=BIN_H && bPos.y<BIN_H && d2d<BIN_R) {
    onScore(); return;
  }

  // Hit floor
  if(bPos.y<=0) {
    bPos.y=0; ball.position.y=0;
    onMiss();
  }
  // Out of world
  if(Math.abs(bPos.x)>14||Math.abs(bPos.z)>14) onMiss();
}

function onScore(){
  won=true; gState=S.DONE;
  ball.visible=false;
  popConfetti(new THREE.Vector3(P_BIN.x, BIN_H+0.2, P_BIN.z));
  const fl=document.getElementById('score-flash');
  fl.classList.remove('pop'); void fl.offsetWidth; fl.classList.add('pop');
  setTimeout(()=>showOverlay('🎉',STR.win,true),600);
}

function onMiss(){
  gState=S.DONE;
  if(tries>0){
    setTimeout(()=>{ resetBall(); document.getElementById('aim-hint').style.opacity='1'; gState=S.IDLE; },900);
  } else {
    setTimeout(()=>showOverlay('😔',STR.lose,false),700);
  }
}

/* ── OVERLAY ──────────────────────────────────────────────────────────── */
function showOverlay(icon,msg,isWin){
  document.getElementById('ol-icon').textContent=icon;
  document.getElementById('ol-msg').textContent=msg;
  document.getElementById('ol-btn').style.background=isWin
    ?'linear-gradient(135deg,#4ade80,#16a34a)'
    :'linear-gradient(135deg,#f97316,#ea580c)';
  document.getElementById('overlay').classList.add('show');
}
window.restartGame=function(){
  tries=MAX_TRIES; won=false; gState=S.IDLE;
  resetBall(); updateDots();
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('aim-hint').style.opacity='1';
  document.getElementById('power-fill').style.height='0%';
  // clear confetti
  for(let i=0;i<CC;i++){cPos[i*3]=99;cVels[i].on=false;}
  cGeo.attributes.position.needsUpdate=true;
};

/* ── RESIZE ──────────────────────────────────────────────────────────── */
function resize(){
  const dpr=Math.min(devicePixelRatio||1,DPR_CAP);
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); addEventListener('orientationchange',resize); resize();
addEventListener('blur', ()=>{ /* pause handled in loop */ });

/* ── RENDER LOOP ──────────────────────────────────────────────────────── */
const devEl=document.getElementById('dev');
const isDev=new URLSearchParams(location.search).has('dev');
if(isDev) devEl.style.display='block';
let frames=0,fpsAt=performance.now(),fps=0;
let paused=false;
addEventListener('blur',()=>paused=true);
addEventListener('focus',()=>{ paused=false; last=performance.now(); });

function frame(now) {
  requestAnimationFrame(frame);
  if(paused){ last=now; return; }
  acc += now-last; last=now;

  while(acc>=STEP){
    acc-=STEP;
    if(gState===S.FLY) physicsTick(STEP);
  }

  // Animate fan blades
  bladeG.rotation.z += 0.07;

  // Wind particles
  const wp=wGeo.attributes.position;
  const wdt=(now-last+STEP)/1000; // approximate real dt for visuals
  for(let i=0;i<WC;i++){
    wLife[i] += 0.008;
    if(wLife[i]>1) { spawnWindPt(i); wLife[i]=0; }
    wPos[i*3] += WIND_AX * 0.016 * (0.6+Math.random()*0.4);
    if(wPos[i*3]>6) spawnWindPt(i);
  }
  wp.array.set(wPos); wp.needsUpdate=true;

  // Confetti
  const cpa=cGeo.attributes.position;
  for(let i=0;i<CC;i++){
    if(!cVels[i].on) continue;
    cVels[i].life -= 0.016;
    cVels[i].y    += GRAVITY*0.016*0.5;
    cPos[i*3]   += cVels[i].x*0.016;
    cPos[i*3+1] += cVels[i].y*0.016;
    cPos[i*3+2] += cVels[i].z*0.016;
    if(cVels[i].life<=0||cPos[i*3+1]<0){ cPos[i*3]=99; cVels[i].on=false; }
  }
  cpa.array.set(cPos); cpa.needsUpdate=true;

  renderer.render(scene,camera);

  if(isDev){ frames++; if(now-fpsAt>=500){ fps=Math.round(frames*1000/(now-fpsAt)); frames=0; fpsAt=now; devEl.textContent=fps+'fps state='+gState; } }
}
requestAnimationFrame(frame);
</script>
</body>
